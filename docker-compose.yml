services:

  web:
    build: .
    ports:
      - "8090:3000"
    environment:
      DB_HOST: db
      DB_USER: isur
      DB_PASSWORD: isur_password
      DB_NAME: isurcloud
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: isurcloud
      MYSQL_USER: isur
      MYSQL_PASSWORD: isur_password
    volumes:
      - db_data:/var/lib/mysql
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
